name: M16 Counterfactual Minimum-Sender Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m16-counterfactual-coverage.yml"
      - "scripts/upstream/m16-counterfactual-coverage.rs"
  workflow_dispatch:

jobs:
  counterfactual-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install pinned upstream Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout pinned upstream source
        run: |
          git clone --depth 1 https://github.com/rchain-community/rchain-rust.git upstream-rchain
          cd upstream-rchain
          git fetch --depth 1 origin d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b
          git checkout --detach d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b

      - name: Inject counterfactual invariant
        run: |
          cat scripts/upstream/m16-counterfactual-coverage.rs             >> upstream-rchain/block-storage/src/dag/finalizer.rs

      - name: Execute counterfactual invariant tests
        working-directory: upstream-rchain
        run: cargo test -p rchain-block-storage m16_counterfactual_coverage_invariant -- --nocapture
