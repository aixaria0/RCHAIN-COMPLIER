name: M15 Upstream Persisted Finality State

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m15-upstream-persisted-finality.yml"
      - "scripts/upstream/m15-persisted-finality.rs"
  workflow_dispatch:

jobs:
  upstream-persisted-finality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install pinned upstream Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout pinned upstream source
        run: |
          git clone --depth 1 https://github.com/rchain-community/rchain-rust.git upstream-rchain
          cd upstream-rchain
          git fetch --depth 1 origin d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b
          git checkout --detach d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b

      - name: Inject M15 persisted finality witness
        run: |
          cat scripts/upstream/m15-persisted-finality.rs             >> upstream-rchain/casper/src/dag.rs

      - name: Execute exact-revision persisted finality probe
        working-directory: upstream-rchain
        run: cargo test -p rchain-casper m15_persisted_finality_state -- --nocapture
