name: RChain C192 C171 Devnet Smoke
on:
  pull_request:
    paths:
      - "tools/evaluate_rchain_attestation_devnet_smoke.py"
      - "tools/inject_rchain_attestation_production_wiring.py"
      - "docs/RCHAIN_C192_C171_DEVNET_SMOKE.md"
      - ".github/workflows/rchain-attestation-devnet-smoke.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  RCHAIN_SHA: 51935310789a1a75a183ad0af7152e4eef450c88
  READ_S: "90"

jobs:
  devnet-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout assurance repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Regression-test smoke evaluator
        run: python3 tools/test_rchain_attestation_devnet_smoke.py

      - name: Checkout pinned rchain-rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rchain-community/rchain-rust
          ref: ${{ env.RCHAIN_SHA }}
          path: upstream

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697

      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Verify exact upstream revision
        run: test "$(git -C upstream rev-parse HEAD)" = "$RCHAIN_SHA"

      - name: Build unmodified control binary
        run: cargo build --manifest-path upstream/Cargo.toml --release -p rchain-node --bin rnode

      - name: Prepare thin runtime image recipe
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Rnode.runtime.Dockerfile" <<'EOF'
          FROM debian:trixie-slim
          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates curl \
              && rm -rf /var/lib/apt/lists/*
          COPY rnode /usr/local/bin/rnode
          RUN useradd --create-home rnode \
              && mkdir -p /var/lib/rnode \
              && chown -R rnode:rnode /var/lib/rnode
          USER rnode
          WORKDIR /var/lib/rnode
          ENTRYPOINT ["rnode"]
          EOF

      - name: Build control runtime image
        run: |
          docker build -t rnode:local \
            -f "$RUNNER_TEMP/Rnode.runtime.Dockerfile" \
            upstream/target/release

      - name: Run pinned control N=3 no-autopropose arm
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/n149-control"
          mkdir -p "$RUNNER_TEMP/n149-control"
          REPO="$GITHUB_WORKSPACE/upstream" \
          ATTEMPTS=1 \
          NS="3" \
          CONTROL_ATTEMPTS=0 \
          CAP=2g \
          SETTLE_S=10 \
          IDLE_S=10 \
          READ_S="$READ_S" \
          JOIN_TIMEOUT=180 \
          DEPLOY_TIMEOUT=45 \
          OUT_ROOT="$RUNNER_TEMP/n149-control" \
            bash upstream/spec/audit/evidence/n149-sweep-run.sh \
            2>&1 | tee "$RUNNER_TEMP/n149-control.log"

      - name: Inject disposable production-path candidate
        run: |
          python3 tools/inject_rchain_attestation_production_wiring.py upstream
          git -C upstream diff --check
          git -C upstream diff -- node/src/runtime/node_runtime.rs \
            > "$RUNNER_TEMP/c192-c171-production-wiring.patch"

      - name: Build candidate binary incrementally
        run: cargo build --manifest-path upstream/Cargo.toml --release -p rchain-node --bin rnode

      - name: Build candidate runtime image
        run: |
          docker build -t rnode:local \
            -f "$RUNNER_TEMP/Rnode.runtime.Dockerfile" \
            upstream/target/release

      - name: Run candidate N=3 no-autopropose arm
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/n149-candidate"
          mkdir -p "$RUNNER_TEMP/n149-candidate"
          REPO="$GITHUB_WORKSPACE/upstream" \
          ATTEMPTS=1 \
          NS="3" \
          CONTROL_ATTEMPTS=0 \
          CAP=2g \
          SETTLE_S=10 \
          IDLE_S=10 \
          READ_S="$READ_S" \
          JOIN_TIMEOUT=180 \
          DEPLOY_TIMEOUT=45 \
          OUT_ROOT="$RUNNER_TEMP/n149-candidate" \
            bash upstream/spec/audit/evidence/n149-sweep-run.sh \
            2>&1 | tee "$RUNNER_TEMP/n149-candidate.log"

      - name: Evaluate control versus candidate
        run: |
          python3 tools/evaluate_rchain_attestation_devnet_smoke.py \
            "$RUNNER_TEMP/n149-control" \
            "$RUNNER_TEMP/n149-candidate" \
            "$READ_S" \
            "$RUNNER_TEMP/c192-c171-devnet-smoke.json"

      - name: Cleanup devnet
        if: ${{ always() }}
        run: |
          cd upstream
          tools/devnet.sh down || true

      - name: Upload smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rchain-c192-c171-devnet-smoke
          path: |
            ${{ runner.temp }}/n149-control
            ${{ runner.temp }}/n149-candidate
            ${{ runner.temp }}/n149-control.log
            ${{ runner.temp }}/n149-candidate.log
            ${{ runner.temp }}/c192-c171-production-wiring.patch
            ${{ runner.temp }}/c192-c171-devnet-smoke.json
          if-no-files-found: warn
          retention-days: 14
