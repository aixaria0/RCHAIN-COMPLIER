name: M18 Exact Threshold Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m18-exact-threshold-boundary.yml"
      - "scripts/upstream/m18-exact-threshold-boundary.rs"
  workflow_dispatch:

jobs:
  exact-threshold-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install pinned upstream Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout pinned upstream source
        run: |
          git clone --depth 1 https://github.com/rchain-community/rchain-rust.git upstream-rchain
          cd upstream-rchain
          git fetch --depth 1 origin d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b
          git checkout --detach d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b

      - name: Inject exact threshold tests
        run: |
          cat scripts/upstream/m18-exact-threshold-boundary.rs             >> upstream-rchain/block-storage/src/dag/finalizer.rs

      - name: Execute exact-revision threshold boundary
        working-directory: upstream-rchain
        run: cargo test -p rchain-block-storage m18_exact_threshold_boundary -- --nocapture
