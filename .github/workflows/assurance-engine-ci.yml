name: Assurance Engine Product
on:
  pull_request:
    paths:
      - "src/lib/assurance/**"
      - "src/lib/lattice/**"
      - "src/lib/integrations/**"
      - "src/lib/compiler/**"
      - "schemas/**"
      - "scripts/*assurance*.mjs"
      - "docs/ASSURANCE_*.md"
      - "README.md"
      - "SECURITY.md"
      - "LICENSE"
      - "package*.json"
      - "tsconfig*.json"
      - ".github/workflows/assurance-engine-ci.yml"
  push:
    branches: [main]
    tags: ["assurance-v*"]
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:assurance
      - run: npm run lint:assurance
      - run: npm run typecheck:assurance
      - run: npm run test:assurance
      - run: npm run test:lattice
      - run: npm run check:lattice-vectors
      - run: npm run demo -- "$RUNNER_TEMP/assurance-demo"
      - run: npm run pack:assurance
      - run: npm run verify:assurance-package
      - name: Retain package checksum
        run: sha256sum dist/aixaria-assurance-engine-*.tgz > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assurance-engine-node-${{ matrix.node }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            ${{ runner.temp }}/assurance-demo/*.ndjson
            ${{ runner.temp }}/assurance-demo/*.json
          if-no-files-found: error
          retention-days: 30
