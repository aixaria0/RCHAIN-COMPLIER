name: M23 Admission To Proposal Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m23-admission-to-proposal-bridge.yml"
      - "scripts/upstream/m23-admission-to-proposal-bridge.rs"
      - "docs/CASPER_CBC_M23_ADMISSION_TO_PROPOSAL_BRIDGE.md"
  workflow_dispatch:

jobs:
  admission-to-proposal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install pinned upstream Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout pinned upstream source
        run: |
          git clone --depth 1 https://github.com/rchain-community/rchain-rust.git upstream-rchain
          cd upstream-rchain
          git fetch --depth 1 origin d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b
          git checkout --detach d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b

      - name: Inject M23 admission-to-proposal bridge
        run: cat scripts/upstream/m23-admission-to-proposal-bridge.rs >> upstream-rchain/casper/src/dag.rs

      - name: Execute exact-revision admission-to-proposal bridge
        working-directory: upstream-rchain
        run: cargo test -p rchain-casper m23_admission_to_proposal_bridge -- --nocapture