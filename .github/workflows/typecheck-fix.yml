name: One-shot TypeScript cleanup

on:
  push:
    branches:
      - feature/reality-evidence-plane

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete auth isolation dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/app-data/client.server.ts")
          text = path.read_text()

          old_import = '''import {
            assertSameSiteRequest,
            CrossSiteRequestError,
          } from "../auth/isolation.server.ts";
          '''
          if old_import not in text:
              raise SystemExit("obsolete auth isolation import not found")
          text = text.replace(old_import, "", 1)

          start = text.find("function crossSiteBlockedResult(): CallToolResult | null {")
          marker = "const FAILURE_MEMO_TTL_MS = 5_000;"
          end = text.find(marker, start)
          if start < 0 or end < 0:
              raise SystemExit("crossSiteBlockedResult block not found")
          text = text[:start] + text[end:]

          old_call = "const blocked = crossSiteBlockedResult() ?? nonPostBlockedResult();"
          if old_call not in text:
              raise SystemExit("crossSiteBlockedResult call not found")
          text = text.replace(old_call, "const blocked = nonPostBlockedResult();", 1)

          path.write_text(text)
          PY

      - name: Commit cleanup and remove this fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/typecheck-fix.yml
          git add src/lib/app-data/client.server.ts
          git commit -m "fix: remove obsolete auth isolation dependency"
          git push
