name: M25 Active Gate Counterfactual

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m25-active-gate-counterfactual.yml"
      - "scripts/upstream/m25-active-gate-counterfactual.rs"
      - "docs/CASPER_CBC_M25_ACTIVE_GATE_COUNTERFACTUAL.md"
  workflow_dispatch:

jobs:
  active-gate-counterfactual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install pinned upstream Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install upstream build prerequisites
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout pinned upstream source
        run: |
          git clone --depth 1 https://github.com/rchain-community/rchain-rust.git upstream-rchain
          cd upstream-rchain
          git fetch --depth 1 origin d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b
          git checkout --detach d92f0787a6096cd6d79864ec2d7c1dd9b6912d0b

      - name: Inject M25 active gate counterfactual
        run: cat scripts/upstream/m25-active-gate-counterfactual.rs >> upstream-rchain/casper/src/validate.rs

      - name: Execute exact-revision active gate counterfactual
        working-directory: upstream-rchain
        run: cargo test -p rchain-casper m25_active_gate_counterfactual -- --nocapture
