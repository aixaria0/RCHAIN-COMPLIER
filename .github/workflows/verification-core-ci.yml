name: Verification Core CI

on:
  pull_request:
    paths:
      - "src/lib/compiler/possibility-plane.ts"
      - "src/lib/compiler/quantitative-what-if.ts"
      - "src/lib/compiler/lexicographic-possibility.ts"
      - "src/lib/compiler/verification-compiler.ts"
      - "src/lib/compiler/finite-state-verifier.ts"
      - "src/lib/compiler/repair-compiler.ts"
      - "src/lib/compiler/repair-compiler.test.ts"
      - "src/lib/compiler/repair-package.ts"
      - "src/lib/compiler/repair-package.test.ts"
      - "src/lib/compiler/signed-repair-root.ts"
      - "src/lib/compiler/*verification*.test.ts"
      - "src/lib/compiler/possibility-plane.test.ts"
      - "src/lib/compiler/quantitative-what-if.test.ts"
      - "src/lib/verification-core/**"
      - "src/lib/subjects/**"
      - "examples/verification-compiler-generic.ts"
      - "examples/aetherforge-external-subject.ts"
      - "examples/aetherforge-minimal-repair.ts"
      - "tsconfig.verification-core.json"
      - "tsconfig.external-subjects.json"
      - "tsconfig.repair-assurance.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verification-core-ci.yml"
  push:
    branches:
      - "feat/assurance-fabric-v1"
    paths:
      - "src/lib/compiler/possibility-plane.ts"
      - "src/lib/compiler/quantitative-what-if.ts"
      - "src/lib/compiler/lexicographic-possibility.ts"
      - "src/lib/compiler/verification-compiler.ts"
      - "src/lib/compiler/finite-state-verifier.ts"
      - "src/lib/compiler/repair-compiler.ts"
      - "src/lib/compiler/repair-compiler.test.ts"
      - "src/lib/compiler/repair-package.ts"
      - "src/lib/compiler/repair-package.test.ts"
      - "src/lib/compiler/signed-repair-root.ts"
      - "src/lib/compiler/*verification*.test.ts"
      - "src/lib/compiler/possibility-plane.test.ts"
      - "src/lib/compiler/quantitative-what-if.test.ts"
      - "src/lib/verification-core/**"
      - "src/lib/subjects/**"
      - "examples/verification-compiler-generic.ts"
      - "examples/aetherforge-external-subject.ts"
      - "examples/aetherforge-minimal-repair.ts"
      - "tsconfig.verification-core.json"
      - "tsconfig.external-subjects.json"
      - "tsconfig.repair-assurance.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verification-core-ci.yml"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck protocol-neutral core
        run: npm run typecheck:verification-core

      - name: Lint protocol-neutral core
        run: npm run lint:verification-core

      - name: Test protocol-neutral core
        run: npm run test:verification-core

      - name: Run standalone generic demo
        run: npm run demo:verification-core

      - name: Typecheck external subjects
        run: npm run typecheck:external-subjects

      - name: Lint external subjects
        run: npm run lint:external-subjects

      - name: Test AETHER FORGE as external subject
        run: npm run test:external-subjects

      - name: Run AETHER FORGE external-subject demo
        run: npm run demo:aetherforge-subject

      - name: Run AETHER FORGE minimal-repair demo
        run: npm run demo:aetherforge-repair

      - name: Typecheck repair assurance package
        run: npm run typecheck:repair-assurance

      - name: Lint repair assurance package
        run: npm run lint:repair-assurance

      - name: Verify repair package and signed root
        run: npm run test:repair-assurance
