name: Fix native TS test imports

on:
  push:
    branches:
      - feature/reality-evidence-plane

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add explicit .ts extensions to local compiler imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("src/lib/compiler")
          changed = []
          for path in root.glob("*.ts"):
              text = path.read_text()
              updated = re.sub(r'from "(\./[^"\n]+|\.\./[^"\n]+)"', lambda m: f'from "{m.group(1) if m.group(1).endswith(".ts") else m.group(1) + ".ts"}"', text)
              updated = re.sub(r'export \* from "(\./[^"\n]+|\.\./[^"\n]+)"', lambda m: f'export * from "{m.group(1) if m.group(1).endswith(".ts") else m.group(1) + ".ts"}"', updated)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print("updated:", *changed, sep="\n")
          PY

      - name: Commit and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ts-import-fix.yml
          git add src/lib/compiler
          if git diff --cached --quiet; then
            echo "No import changes required."
            exit 0
          fi
          git commit -m "fix: make compiler imports native-test resolvable"
          git push
