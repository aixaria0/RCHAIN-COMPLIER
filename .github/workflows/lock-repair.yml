name: Repair package lock

on:
  push:
    branches:
      - ci/verify-reality-plane

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lock-repair.yml
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "fix: regenerate package lock from manifest"
          git push
